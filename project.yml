name: MenuTodo
options:
  bundleIdPrefix: com.hugoprinsloo
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Personal Apple Developer team (Hugo Prinsloo). Debug builds sign with "Apple Development";
    # release builds are exported with "Developer ID Application" by scripts/release.sh.
    DEVELOPMENT_TEAM: 7VT5H6VPXH
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  MenuTodo:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MenuTodo
    info:
      path: MenuTodo/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: MenuTodo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Copyright © 2026 Hugo Prinsloo. MIT License."
        NSPrincipalClass: NSApplication
        NSRemindersFullAccessUsageDescription: "MenuTodo mirrors your list to a Reminders list you choose so it shows up on your other devices."
        NSRemindersUsageDescription: "MenuTodo mirrors your list to a Reminders list you choose so it shows up on your other devices."
    entitlements:
      path: MenuTodo/MenuTodo.entitlements
      properties:
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_NAME: MenuTodo
        PRODUCT_BUNDLE_IDENTIFIER: com.hugoprinsloo.MenuTodo
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
