name: MenuTodo
options:
  bundleIdPrefix: com.hugoprinsloo
  deploymentTarget:
    macOS: "14.0"
  defaultConfig: Debug
configs:
  Debug: debug
  Release: release
  AppStore: release
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Personal Apple Developer team (Hugo Prinsloo). Debug builds sign with "Apple Development";
    # release builds are exported with "Developer ID Application" by scripts/release.sh.
    DEVELOPMENT_TEAM: 7VT5H6VPXH
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  MenuTodo:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MenuTodo
    info:
      path: MenuTodo/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: MenuTodo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Copyright © 2026 Hugo Prinsloo. MIT License."
        NSPrincipalClass: NSApplication
        NSRemindersFullAccessUsageDescription: "MenuTodo mirrors your list to a Reminders list you choose so it shows up on your other devices."
        NSRemindersUsageDescription: "MenuTodo mirrors your list to a Reminders list you choose so it shows up on your other devices."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: MenuTodo
        PRODUCT_BUNDLE_IDENTIFIER: com.hugoprinsloo.MenuTodo
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_ENTITLEMENTS: MenuTodo/MenuTodo.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        AppStore:
          ENABLE_APP_SANDBOX: YES
          CODE_SIGN_ENTITLEMENTS: MenuTodo/MenuTodo-AppStore.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APPSTORE"
schemes:
  MenuTodo:
    build:
      targets:
        MenuTodo: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  MenuTodo-AppStore:
    build:
      targets:
        MenuTodo: all
    run:
      config: AppStore
    test:
      config: AppStore
    profile:
      config: AppStore
    analyze:
      config: AppStore
    archive:
      config: AppStore
