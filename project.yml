name: MenuTodo
options:
  bundleIdPrefix: com.hugoprinsloo
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_STYLE: Manual
targets:
  MenuTodo:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MenuTodo
    settings:
      base:
        PRODUCT_NAME: MenuTodo
        PRODUCT_BUNDLE_IDENTIFIER: com.hugoprinsloo.MenuTodo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
    info:
      path: Generated-Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: MenuTodo
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: ""
